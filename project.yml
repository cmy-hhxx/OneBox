name: OneBox

options:
  bundleIdPrefix: com.cmy
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: true

packages:
  OneBoxCore:
    path: Packages/OneBoxCore
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1

targets:
  StockWatchTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/StockWatch
        excludes:
          - Resources/Sounds
    dependencies:
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: GRDB
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # Xcode does not propagate GRDBSQLite's Clang module map to static library targets.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(BUILD_DIR)/../../SourcePackages/checkouts/GRDB.swift/Sources/GRDBSQLite/module.modulemap"

  PodPinTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/PodPin
        excludes:
          - Resources/Fixtures/README.md
          - Resources/Fixtures/podpin-sample.m4a
          - Resources/Tools/README.md
    dependencies:
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: GRDB
      - package: GRDB
        product: GRDBSQLite
    # Xcode 26.6 does not propagate GRDBSQLite's Clang module map through a
    # static target. Keep these flags on PodPinTool and its Swift consumers.
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(BUILD_DIR)/../../SourcePackages/checkouts/GRDB.swift/Sources/GRDBSQLite/module.modulemap"

  AsciiArtTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/AsciiArt
    dependencies:
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  OneBox:
    type: application
    platform: macOS
    sources:
      - path: OneBox/App
      - path: docs/assets/brand/onebox-mark-light.png
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Licenses/GRDB-MIT.txt
        buildPhase: resources
      - path: OneBox/Tools/PodPin/Resources/Fixtures/podpin-sample.m4a
        buildPhase: resources
      - path: OneBox/Tools/StockWatch/Resources/Sounds/bull-moo.wav
        buildPhase: resources
      - path: OneBox/Tools/StockWatch/Resources/Sounds/bear-growl.wav
        buildPhase: resources
    dependencies:
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: OneBoxCore
        product: OneBoxHost
      - target: StockWatchTool
      - target: PodPinTool
      - package: GRDB
      - package: GRDB
        product: GRDBSQLite
      - target: AsciiArtTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBox
        PRODUCT_NAME: OneBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: OneBox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(BUILD_DIR)/../../SourcePackages/checkouts/GRDB.swift/Sources/GRDBSQLite/module.modulemap"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: podpin-sample.m4a

  OneBoxAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/App
    dependencies:
      - target: OneBox
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(BUILD_DIR)/../../SourcePackages/checkouts/GRDB.swift/Sources/GRDBSQLite/module.modulemap"
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBoxAppTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OneBox.app/Contents/MacOS/OneBox"

  AsciiArtToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AsciiArt
      - path: docs/assets/brand/onebox-mark-light.png
        buildPhase: resources
    dependencies:
      - target: AsciiArtTool
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.AsciiArtToolTests
        GENERATE_INFOPLIST_FILE: true

  PodPinToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PodPin
      - path: OneBox/Tools/PodPin/Resources/Fixtures/podpin-sample.m4a
        buildPhase: resources
    dependencies:
      - target: PodPinTool
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: GRDB
      - package: GRDB
        product: GRDBSQLite
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(BUILD_DIR)/../../SourcePackages/checkouts/GRDB.swift/Sources/GRDBSQLite/module.modulemap"
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.PodPinToolTests
        GENERATE_INFOPLIST_FILE: true

  StockWatchToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/StockWatch
    dependencies:
      - target: StockWatchTool
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: GRDB
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.StockWatchToolTests
        GENERATE_INFOPLIST_FILE: true

  StockWatchPerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/StockWatchPerformance
    dependencies:
      - target: StockWatchTool
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: GRDB
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.StockWatchPerformanceTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  OneBox:
    build:
      targets:
        OneBox: all
        OneBoxAppTests: [test]
        AsciiArtToolTests: [test]
        PodPinToolTests: [test]
        StockWatchToolTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OneBoxAppTests
        - AsciiArtToolTests
        - PodPinToolTests
        - StockWatchToolTests

  AsciiArtBenchmark:
    build:
      targets:
        AsciiArtToolTests: [test]
    test:
      config: Release
      targets:
        - AsciiArtToolTests

  StockWatchBenchmark:
    build:
      targets:
        StockWatchPerformanceTests: [test]
    test:
      config: Release
      targets:
        - StockWatchPerformanceTests
