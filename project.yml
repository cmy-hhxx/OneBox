name: OneBox

options:
  bundleIdPrefix: com.cmy
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: true
    ENABLE_CODE_COVERAGE: false

packages:
  OneBoxCore:
    path: Packages/OneBoxCore
  AsciiArtTool:
    path: Packages/Tools/AsciiArtTool
  StockWatchTool:
    path: Packages/Tools/StockWatchTool
  PodPinTool:
    path: Packages/Tools/PodPinTool

targets:
  OneBox:
    type: application
    platform: macOS
    sources:
      - path: OneBox/App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Licenses/GRDB-MIT.txt
        buildPhase: resources
      - path: Packages/Tools/PodPinTool/Tests/PodPinToolTests/Resources/Fixtures/podpin-sample.m4a
        buildPhase: resources
    dependencies:
      - package: OneBoxCore
        product: OneBoxRuntime
      - package: OneBoxCore
        product: OneBoxDesignSystem
      - package: OneBoxCore
        product: OneBoxHost
      - package: StockWatchTool
        product: StockWatchTool
      - package: PodPinTool
        product: PodPinTool
      - package: AsciiArtTool
        product: AsciiArtTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBox
        PRODUCT_NAME: OneBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: OneBox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
          EXCLUDED_SOURCE_FILE_NAMES: podpin-sample.m4a

  OneBoxAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/App
    dependencies:
      - target: OneBox
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBoxAppTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OneBox.app/Contents/MacOS/OneBox"


schemes:
  OneBox:
    build:
      targets:
        OneBox: all
        OneBoxAppTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OneBoxAppTests
