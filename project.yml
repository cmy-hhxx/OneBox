name: OneBox

options:
  bundleIdPrefix: com.cmy
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: true

targets:
  OneBoxRuntime:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Runtime
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  OneBoxDesignSystem:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/DesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  OneBoxHost:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Host
    dependencies:
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  StockWatchTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/StockWatch
    dependencies:
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  BlogListenTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/BlogListen
    dependencies:
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  WindowFocusTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/WindowFocus
    dependencies:
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  AsciiArtTool:
    type: library.static
    platform: macOS
    sources:
      - path: OneBox/Tools/AsciiArt
    dependencies:
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  OneBox:
    type: application
    platform: macOS
    sources:
      - path: OneBox/App
    dependencies:
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
      - target: OneBoxHost
      - target: StockWatchTool
      - target: BlogListenTool
      - target: WindowFocusTool
      - target: AsciiArtTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBox
        PRODUCT_NAME: OneBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: OneBox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  OneBoxAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/App
    dependencies:
      - target: OneBox
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBoxAppTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OneBox.app/Contents/MacOS/OneBox"

  OneBoxRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Runtime
    dependencies:
      - target: OneBoxRuntime
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBoxRuntimeTests
        GENERATE_INFOPLIST_FILE: true

  OneBoxDesignSystemTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DesignSystem
    dependencies:
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.OneBoxDesignSystemTests
        GENERATE_INFOPLIST_FILE: true

  AsciiArtToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AsciiArt
    dependencies:
      - target: AsciiArtTool
      - target: OneBoxRuntime
      - target: OneBoxDesignSystem
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        PRODUCT_BUNDLE_IDENTIFIER: com.cmy.AsciiArtToolTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  OneBox:
    build:
      targets:
        OneBox: all
        OneBoxAppTests: [test]
        OneBoxRuntimeTests: [test]
        OneBoxDesignSystemTests: [test]
        AsciiArtToolTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OneBoxAppTests
        - OneBoxRuntimeTests
        - OneBoxDesignSystemTests
        - AsciiArtToolTests

  AsciiArtBenchmark:
    build:
      targets:
        AsciiArtToolTests: [test]
    test:
      config: Release
      targets:
        - AsciiArtToolTests
